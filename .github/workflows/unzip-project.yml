name: Extract Mingle-Connect

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o Mingle-Connect-Stage-8C-FULL.zip -d extracted
          cp -r extracted/. .
          rm -rf extracted
          rm -f Mingle-Connect-Stage-8C-FULL.zip
          rm -f Mingle-Connect-Stage-8C.zip

      - name: Commit project files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Add Mingle-Connect project files" || echo "Nothing to commit"
          git push
